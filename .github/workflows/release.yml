name: Build and Release DiagramCraft Studio Setup

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Descargar y Empaquetar JRE 21 Portable (Zero-Dependencies)
        run: |
          Write-Host "Descargando JRE 21 portable desde Adoptium API..."
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile "jre.zip"
          Expand-Archive -Path "jre.zip" -DestinationPath "temp_jre"
          $jreSubFolder = Get-ChildItem -Directory temp_jre | Select-Object -First 1
          if (-not (Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" }
          Move-Item -Path $jreSubFolder.FullName -Destination "bin\jre"
          Remove-Item -Recurse -Force temp_jre, jre.zip
          Write-Host "Verificando JRE embebido en bin\jre\bin\java.exe:"
          Test-Path "bin\jre\bin\java.exe"

      - name: Compilar Aplicación de Escritorio Nativa con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --noconsole `
            --name "DiagramCraft" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "bin;bin" `
            --hidden-import "clr" `
            --hidden-import "pythonnet" `
            --hidden-import "webview" `
            desktop_launcher.py

      - name: Compilar Instalador Setup.exe con Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Crear Paquete Portable ZIP
        run: |
          Compress-Archive -Path dist\DiagramCraft\* -DestinationPath dist_installer\DiagramCraft_Studio_Portable.zip

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/*.exe
            dist_installer/*.zip
          name: DiagramCraft Studio ${{ github.ref_name }} (Zero Dependencies Edition)
          draft: false
          prerelease: false
          generate_release_notes: true
